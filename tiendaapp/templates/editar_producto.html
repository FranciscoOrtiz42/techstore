{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar {{ producto.nombre }} | TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'tiendaapp/estilos.css' %}?v=2">
</head>
<body>
    {% include "navbar.html" %}

    <main class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 640px;">
            <div class="card-body p-4">
                <h1 class="h3 mb-4">Editar producto</h1>
                <!-- U: formulario separado del alta; la URL identifica la fila que recibirá el UPDATE. -->
                <form method="POST" data-confirmar-producto="editar">
                    {% csrf_token %}
                    {{ formulario.as_p }}
                    <div class="d-flex gap-2 justify-content-end">
                        <a class="btn btn-secondary" href="{% url 'inicio' %}">Cancelar</a>
                        <button class="btn btn-primary" type="submit">Guardar cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'tiendaapp/producto_confirmacion.js' %}"></script>
</body>
</html>
