<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-info" href="{% if request.user.is_authenticated %}{% url 'inicio' %}{% else %}{% url 'login' %}{% endif %}">
            <i class="bi bi-cpu-fill me-2"></i>TechStore Admin
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            {% if request.user.is_authenticated %}
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'inicio' %}active{% endif %}" href="{% url 'inicio' %}">
                        <i class="bi bi-house-door me-1"></i>Inicio
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'lista_productos' %}active{% endif %}" href="{% url 'lista_productos' %}">
                        <i class="bi bi-box-seam me-1"></i>Inventario
                    </a>
                </li>
            </ul>
            {% endif %}
            <div class="navbar-actions d-flex align-items-center gap-3 ms-lg-auto">
                {% if mostrar_nuevo %}
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCrearProducto">
                    <i class="bi bi-plus-circle me-1"></i>Nuevo Artículo
                </button>
                {% endif %}
                {% if request.user.is_authenticated %}
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-outline-light session-link" type="submit">
                        <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
                    </button>
                </form>
                {% else %}
                <a class="btn btn-outline-light session-link" href="{% url 'login' %}">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión
                </a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
